name: Backend verification
on:
  push:
    paths: ['avionics-backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['avionics-backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: avionics-backend
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev
      - run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-ci --parallel 2
      - run: ctest --test-dir build-ci --output-on-failure
      - run: python3 scripts/verify_live_roundtrip.py --build build-ci --config config/ground-monitor.example.ini
      - run: python3 scripts/verify_analysis_recovery.py --build build-ci
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
        working-directory: avionics-backend
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-ci --parallel 2
      - run: ctest --test-dir build-ci --output-on-failure
      - run: python scripts/verify_live_roundtrip.py --build build-ci --config config/ground-monitor.example.ini
      - run: python scripts/verify_analysis_recovery.py --build build-ci
      - run: python scripts/verify_capture_cli.py --build build-ci
