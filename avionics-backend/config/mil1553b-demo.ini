# Software monitor records and synthetic engineering definitions; not an aircraft ICD.
[dictionary]
schema=2
version=mil1553b-software-demo-v1

[protocol bus1553]
channel=0
protocol=1553
selection=auto
capture_representation=mil1553b.monitor-v1

[parameter command]
source=bus1553
protocol=1553
channel=0
rt_address=3
subaddress=1
direction=receive
bit_offset=0
bit_width=16
byte_order=big
type=unsigned
scale=0.001
unit=ratio
max_age_ms=100

[parameter temperature_a]
source=bus1553
protocol=1553
channel=0
rt_address=3
subaddress=1
direction=receive
bit_offset=16
bit_width=16
byte_order=big
type=signed
scale=0.01
unit=degC
max_age_ms=100

[parameter position]
source=bus1553
protocol=1553
channel=0
rt_address=4
subaddress=2
direction=transmit
bit_offset=0
bit_width=16
byte_order=big
type=unsigned
scale=0.001
unit=ratio
max_age_ms=100

[parameter temperature_b]
source=bus1553
protocol=1553
channel=0
rt_address=4
subaddress=3
direction=transmit
bit_offset=0
bit_width=16
byte_order=big
type=signed
scale=0.01
unit=degC
max_age_ms=100

[parameter received_temperature]
source=bus1553
protocol=1553
channel=0
rt_address=5
subaddress=3
direction=receive
bit_offset=0
bit_width=16
byte_order=big
type=signed
scale=0.01
unit=degC
max_age_ms=100

[parameter broadcast_counter]
source=bus1553
protocol=1553
channel=0
rt_address=31
subaddress=4
direction=receive
bit_offset=0
bit_width=16
byte_order=big
type=unsigned
unit=count
max_age_ms=100

[clock bus1553]
domain=1
group=synthetic_host
offset_ns=0
uncertainty_ns=0

[consistency temperatures]
left_source=bus1553
left_parameter=temperature_a
right_source=bus1553
right_parameter=temperature_b
tolerance=0.25
window_ms=50

[response actuator]
command_source=bus1553
command_parameter=command
response_source=bus1553
response_parameter=position
command_threshold=0.5
response_threshold=0.5
max_delay_ms=100

[processing]
allowed_lateness_ms=20
