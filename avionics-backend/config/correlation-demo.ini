# Synthetic payload definitions. This is not an aircraft ICD.
[dictionary]
schema=1
version=synthetic-correlation-v1

[parameter command]
source=control
protocol=65535
channel=0
bit_offset=0
bit_width=64
byte_order=little
type=signed
scale=0.001
unit=ratio
max_age_ms=50
sequence_step=1

[parameter position]
source=feedback
protocol=65535
channel=0
bit_offset=0
bit_width=64
byte_order=little
type=signed
scale=0.001
unit=ratio
max_age_ms=50
sequence_step=1

[parameter temperature_a]
source=sensor_a
protocol=65535
channel=0
bit_offset=0
bit_width=64
byte_order=little
type=signed
scale=0.001
unit=degC
max_age_ms=20
sequence_step=1

[parameter temperature_b]
source=sensor_b
protocol=65535
channel=0
bit_offset=0
bit_width=64
byte_order=little
type=signed
scale=0.001
unit=degC
max_age_ms=20
sequence_step=1

# group means a verified shared time basis, NOT automatic synchronization.
[clock control]
domain=1
group=host
offset_ns=0
uncertainty_ns=0

[clock feedback]
domain=1
group=host
offset_ns=0
uncertainty_ns=0

[clock sensor_a]
domain=1
group=host
offset_ns=0
uncertainty_ns=0

[clock sensor_b]
domain=1
group=host
offset_ns=0
uncertainty_ns=0

[consistency sensor_agreement]
left_source=sensor_a
left_parameter=temperature_a
right_source=sensor_b
right_parameter=temperature_b
tolerance=0.25
window_ms=5

[response actuator]
command_source=control
command_parameter=command
response_source=feedback
response_parameter=position
command_threshold=0.5
response_threshold=0.5
max_delay_ms=30
